[project]
name = "llm-irc"
version = "0.1.0"
description = "Terminal IRC client with a local LLM (LM Studio) that suggests replies"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=1.0", "openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
llm-irc = "llm_irc.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_irc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
